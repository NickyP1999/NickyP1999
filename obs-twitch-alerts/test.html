<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alert Test Panel — Cowboy Bebop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* The test page shows a dark starfield + control buttons so you can
       preview alerts WITHOUT going live. The real overlay (index.html)
       stays transparent. */
    body {
      background:
        radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent),
        radial-gradient(1px 1px at 70% 60%, #fff6 50%, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff5 50%, transparent),
        radial-gradient(2px 2px at 85% 25%, #f3b41b88 50%, transparent),
        radial-gradient(1px 1px at 55% 15%, #14a0a088 50%, transparent),
        radial-gradient(circle at 50% 35%, #14110d, #050505 75%);
    }
    .panel {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      background: rgba(10,10,10,.92); padding: 18px 22px;
      border: 1px solid #f3b41b55; border-top: 3px solid #f3b41b; max-width: 92vw;
    }
    .panel button {
      background:#111; color:#f3ead3; border:1px solid #f3b41b88;
      padding:11px 18px; font-family:"Oswald",sans-serif; letter-spacing:1px;
      text-transform:uppercase; font-weight:700; cursor:pointer; font-size:14px;
    }
    .panel button:hover { background:#f3b41b; color:#0a0a0a; }
    .hint { position: fixed; top: 20px; left: 0; right: 0; text-align:center;
            color:#f3b41b; font-family:"Oswald",sans-serif; letter-spacing:3px;
            text-transform:uppercase; font-size:14px; }
  </style>
</head>
<body class="hide-status">
  <div class="hint">♪ 3 · 2 · 1 · Let's Jam — click a button to preview that alert</div>
  <div id="alert-root"></div>

  <div class="panel">
    <button data-fire="follow">Follow</button>
    <button data-fire="sub">Sub</button>
    <button data-fire="resub">Resub</button>
    <button data-fire="giftSub">Gift Subs</button>
    <button data-fire="cheer">Bits</button>
    <button data-fire="raid">Raid</button>
    <button data-fire="donation">Donation</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/alerts.js"></script>
  <script>
    // sample data for each alert type
    const samples = {
      follow:   { name: "CoolViewer42" },
      sub:      { name: "GamerGirl_99" },
      resub:    { name: "LoyalFan",    amount: 6 },
      giftSub:  { name: "GenerousGus", amount: 5 },
      cheer:    { name: "BitLord",     amount: 500 },
      raid:     { name: "BigStreamer", amount: 128 },
      donation: { name: "KindStranger",amount: "$10.00" },
    };
    document.querySelectorAll("[data-fire]").forEach(btn => {
      btn.onclick = () => window.Alerts.fire(btn.dataset.fire, samples[btn.dataset.fire]);
    });
  </script>
</body>
</html>
