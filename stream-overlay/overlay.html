<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NC Stream Overlay</title>
  <link rel="stylesheet" href="css/overlay.css" />
</head>
<body>
  <!-- brand -->
  <img class="brand-logo" src="assets/logo.png" alt="NC" />

  <!-- now playing (top-right) -->
  <div id="spotify" class="np-card">
    <img id="sp-art" class="np-art" alt="" />
    <div class="np-info">
      <div class="np-label">Now Playing</div>
      <div id="sp-title" class="np-title">—</div>
      <div id="sp-artist" class="np-artist"></div>
      <div class="np-bar"><div id="sp-bar-fill" class="np-bar-fill"></div></div>
    </div>
  </div>

  <!-- handcam slot (left, below minimap) -->
  <section class="frame frame-cam"><i class="scan"></i><span class="frame-tab">CAM</span></section>

  <!-- keyboard overlay slot (left, under handcam) -->
  <section class="frame frame-keys"><i class="scan"></i><span class="frame-tab">KEYS</span></section>

  <script src="js/overlay-config.js"></script>
  <script src="js/spotify.js"></script>
  <script>
    // apply accent + labels from config (the ◆ is a CSS ::before, so setting
    // textContent here keeps it intact)
    const C = window.OVERLAY_CONFIG;
    document.documentElement.style.setProperty("--accent", C.accent);
    document.querySelector(".frame-cam .frame-tab").textContent = C.labels.cam;
    document.querySelector(".frame-keys .frame-tab").textContent = C.labels.keys;
    window.addEventListener("DOMContentLoaded", () => window.SpotifyNP.start());
  </script>
</body>
</html>
